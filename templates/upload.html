<!DOCTYPE html>
<html>
<head>
    <title>Upload Fingerprint</title>
    <style>
        body {
            background: linear-gradient(135deg, #990000, #330000);
            font-family: 'Poppins';
            text-align: center;
            color: white;
        }

        .container {
            margin: 100px auto;
            width: 450px;
            background: rgba(255,255,255,0.15);
            padding: 35px;
            border-radius: 15px;
            backdrop-filter: blur(7px);
        }

        button {
            padding: 12px 25px;
            background: #00c853;
            color: white;
            border: none;
            border-radius: 15px;
            width: 90%;
            font-size: 18px;
            margin-top: 20px;
            transition: .3s;
        }

        button:hover { transform: scale(1.1); }
    </style>
</head>

<body>
<div class="container">
    <h2>Upload Fingerprint</h2>

    <form method="POST" action="/predict" enctype="multipart/form-data">
        <input type="file" name="file" required>

        <button type="submit">Detect Blood Group</button>
    </form>
</div>
</body>
</html>
