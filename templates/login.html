<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #660000, #200000);
            font-family: 'Poppins';
            text-align: center;
            color: white;
        }

        .box {
            width: 400px;
            padding: 35px;
            margin: 110px auto;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            backdrop-filter: blur(7px);
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 10px;
            border: none;
        }

        button {
            background: #ff0030;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>
<div class="box">
    <h2>Login</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>New user? <a href="/register">Register here</a></p>
</div>
</body>
</html>
